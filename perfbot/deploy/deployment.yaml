# PerfBot Azure App Service deployment manifest
# Deploy via: az webapp create --resource-group <rg> --plan <plan> --name perfbot --deployment-container-image-name <acr>.azurecr.io/perfbot:latest

apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfbot
  namespace: performance
  labels:
    app: perfbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perfbot
  template:
    metadata:
      labels:
        app: perfbot
    spec:
      containers:
        - name: perfbot
          image: congaperformance.azurecr.io/perfbot:v0.1.0
          ports:
            - containerPort: 3978
          envFrom:
            - secretRef:
                name: perfbot-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3978
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3978
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: perfbot
  namespace: performance
spec:
  selector:
    app: perfbot
  ports:
    - port: 80
      targetPort: 3978
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: perfbot
  namespace: performance
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: perfbot.congacloud.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: perfbot
                port:
                  number: 80
