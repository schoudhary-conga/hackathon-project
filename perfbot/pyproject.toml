[project]
name = "perfbot"
version = "0.1.0"
description = "AI-Powered Performance Insights Bot for Microsoft Teams"
requires-python = ">=3.12"
dependencies = [
    "botbuilder-core>=4.16",
    "botbuilder-integration-aiohttp>=4.16",
    "aiohttp>=3.9",
    "openai>=1.30",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
